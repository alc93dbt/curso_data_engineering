sources:
  - name: sql_server_dbo # name of the source
    schema: sql_server_dbo # this is the schema our raw data lives in
    database: ALUMNO4_DEV_BRONZE_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      warn_after: { count: 500, period: day }
      error_after: { count: 800, period: day }

    tables:
      - name: ADDRESSES
        loaded_at_field: _fivetran_synced
        columns:
          - name: address
            description: >
              Street name, address number.
          - name: ADDRESS_ID
            description: >
              Unique identifier for each address.
            tests:
              - unique
              - not_null
          - name: country
            description: >
              Country associated with the user's address.
          - name: state
            description: >
              State linked to the address.
          - name: zipcode
            description: >
              Postal code corresponding to the registered address.
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null

      - name: events
        loaded_at_field: _fivetran_synced
        columns:
          - name: event_id
            description: >
              Unique identifier of the recorded event.
            tests:
              - unique
              - not_null
          - name: page_url
            description: >
              URL of the page where the event occurred.
          - name: event_type
            description: >
              Type or category of the recorded event.
          - name: user_id
            description: >
              User associated with the event.
          - name: product_id
            description: >
              Product related to the event, if applicable.
          - name: session_id
            description: >
              Session identifier in which the event occurred.
          - name: created_at
            description: >
              Date and time of event creation.
          - name: order_id
            description: >
              Order associated with the event (if exists).
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null

      - name: orders
        loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
            description: >
              Unique identifier for each order.
            tests:
              - unique
              - not_null
          - name: shipping_service
            description: >
              Courier service used for the shipment.
          - name: shipping_cost
            description: >
              Shipping cost associated with the order.
          - name: address_id
            description: >
              Reference to the shipping address used for the order.
          - name: created_at
            description: >
              Date and time of order creation.
          - name: promo_id
            description: >
              Identifier of the promotion applied to the order (if any).
          - name: estimated_delivery_at
            description: >
              Estimated delivery date of the order.
          - name: order_cost
            description: >
              Base cost amount of the order (excluding shipping).
          - name: user_id
            description: >
              User who placed the order.
            tests:
              - not_null
          - name: order_total
            description: >
              Total amount to be paid for the order (includes discounts and shipping).
          - name: delivered_at
            description: >
              Actual delivery date and time of the order.
          - name: status
            description: >
              Current status of the order (pending, delivered, cancelled, etc.).
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null

      - name: order_items
        loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
            description: >
              Order to which this item belongs.
            tests:
              - not_null
          - name: product_id
            description: >
              Product sold within the order.
            tests:
              - not_null
          - name: quantity
            description: >
              Units of product included in the order.
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null

      - name: products
        loaded_at_field: _fivetran_synced
        columns:
          - name: product_id
            description: >
              Unique identifier of the product.
            tests:
              - unique
              - not_null
          - name: price
            description: >
              Unit price of the product.
          - name: name
            description: >
              Product name.
          - name: inventory
            description: >
              Available quantity in inventory.
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null

      - name: promos
        loaded_at_field: _fivetran_synced
        columns:
          - name: promo_id
            description: >
              Unique identifier of the promotion.
            tests:
              - unique
              - not_null
          - name: discount
            description: >
              Discount applied in dollars (USD) for the promotion.
          - name: status
            description: >
              Status of the promotion (active, inactive, expired, etc.).
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null

      - name: users
        loaded_at_field: _fivetran_synced
        columns:
          - name: user_id
            description: >
              Unique identifier of the user.
            tests:
              - unique
              - not_null
          - name: updated_at
            description: >
              Date and time of the last update to the user's data.
          - name: address_id
            description: >
              Unique identifier for each address.
          - name: last_name
            description: >
              User's last name.
          - name: created_at
            description: >
              Date and time the user was created in the system.
          - name: phone_number
            description: >
              User's contact phone number.
          - name: total_orders
            description: >
              Total number of orders placed by the user.
          - name: first_name
            description: >
              User's first name.
          - name: email
            description: >
              User's email.
          - name: _fivetran_deleted
            description: '{{ doc("fivetran_deleted") }}'
          - name: _fivetran_synced
            description: '{{ doc("fivetran_synced") }}'
            tests:
              - not_null
